<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">  <link rel="stylesheet" href="css/style.css">  <title>Módulo Bancos</title>
  <style>
    body{margin:0;font-family:'Segoe UI',sans-serif;background:#f5f7fb;color:#333;}
    header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:linear-gradient(90deg,#2b5876,#4e4376);color:#fff;}
    header h1{margin:0;font-size:22px;}
    header button{background:#fff;color:#2b5876;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;transition:background 0.3s;}
    header button:hover{background:#e5e5e5;}
    .container{max-width:1000px;margin:20px auto;padding:0 20px;}
    .filters{display:flex;gap:12px;margin-bottom:20px;align-items:center;}
    .filters input[type="date"]{padding:6px;border:1px solid #ccc;border-radius:6px;font-size:15px;}
    .filters button{background:#2b5876;color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;transition:background 0.3s;}
    .filters button:hover{background:#4e4376;}
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.05);}
    th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;}
    th{background:#f0f4f8;color:#333;font-weight:600;}
    tr:last-child td{border-bottom:none;}
  </style>
</head>
<body class="app app-bg-photo hide-legacy-actions">
<header class="app-header">
  <h1>Reporte Bancario</h1>
  <button onclick="window.location.href='inventario.html'" class="back-btn">Volver</button>
</header>
<div class="container">
  <div class="filters">
    <label>Cuenta
      <select id="cuentaBanco">
        <option value="">Seleccione cuenta...</option>
      </select>
    </label>
    <label>Inicio <input type="date" id="inicio"></label>
    <label>Fin <input type="date" id="fin"></label>
    <button onclick="consultar()">Consultar</button>
  </div>
  <div id="cuentasInfo" style="margin-bottom:10px;color:#555;font-size:14px;">Máximo 3 cuentas bancarias activas.</div>
  <table id="reporte">
    <thead>
      <tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Referencia</th><th>Contracuenta</th><th>Conciliado</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="totales" class="text-muted" style="margin-top:10px;color:#333;font-size:14px;"></div>
</div>
<script>
async function consultar(){
  const inicio=document.getElementById('inicio').value;
  const fin=document.getElementById('fin').value;
  const cuenta=document.getElementById('cuentaBanco').value;
  const tbody = document.querySelector('#reporte tbody');
  const totBox = document.getElementById('totales');
  tbody.innerHTML = '';
  totBox.textContent = '';
  if(!cuenta){
    tbody.innerHTML = '<tr><td colspan="6">Seleccione una cuenta bancaria.</td></tr>';
    return;
  }
  const params=[];
  params.push('bank_account_id='+encodeURIComponent(cuenta));
  if(inicio) params.push('from='+encodeURIComponent(inicio));
  if(fin) params.push('to='+encodeURIComponent(fin));
  let url='api/bank_movements?'+params.join('&');
  try{
    const resp = await fetch(url, { credentials:'include' });
    const data = await resp.json();
    if (!resp.ok) {
      const msg = data && data.error ? data.error : 'Error al obtener movimientos';
      tbody.innerHTML = '<tr><td colspan="6">'+msg+'</td></tr>';
      return;
    }
    if (!Array.isArray(data) || !data.length) {
      tbody.innerHTML = '<tr><td colspan="6">Sin movimientos para este rango.</td></tr>';
      return;
    }
    let total = 0;
    data.forEach(r => {
      const monto = Number(r.monto||0);
      total += monto;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.fecha||''}</td><td>${r.tipo||''}</td><td>${monto.toFixed(2)}</td><td>${r.referencia||''}</td><td>${r.contracuenta_code||''}</td><td>${r.conciliado?'Sí':'No'}</td>`;
      tbody.appendChild(tr);
    });
    totBox.textContent = 'Total movimientos en periodo: Q'+total.toFixed(2);
  } catch(err){
    console.error(err);
    tbody.innerHTML = '<tr><td colspan="6">Error obteniendo movimientos</td></tr>';
  }
}
async function cargarCuentas(){
  const box = document.getElementById('cuentasInfo');
  const sel = document.getElementById('cuentaBanco');
  try{
    const resp = await fetch('api/bank_accounts', { credentials:'include' });
    const data = await resp.json();
    if (!resp.ok || !Array.isArray(data)) {
      box.textContent = 'No se pudieron cargar las cuentas bancarias.';
      return;
    }
    sel.innerHTML = '<option value=\"\">Seleccione cuenta...</option>';
    if (!data.length) {
      box.textContent = 'Aún no hay cuentas bancarias registradas (máximo 3 permitidas).';
      return;
    }
    data.forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name || ('Cuenta #' + c.id);
      sel.appendChild(opt);
    });
    const names = data.map(c => c.name || ('Cuenta #' + c.id)).join(', ');
    box.textContent = 'Cuentas bancarias (' + data.length + '/3): ' + names;
  } catch(e){
    if(box) box.textContent = 'No se pudieron cargar las cuentas bancarias.';
  }
}
document.addEventListener('DOMContentLoaded', ()=>{
  cargarCuentas().then(consultar);
});
</script>
<script src="js/profile.js"></script>
<div id="profileModal" class="modal" style="display:none;">
  <div class="box" style="max-width:420px;">
    <h3 style="margin-top:0;">Perfil</h3>
    <div style="display:flex;gap:14px;align-items:center;">
      <img data-profile-photo src="" alt="Foto" style="width:64px;height:64px;border-radius:16px;object-fit:cover;background:#e2e8f0;">
      <div>
        <div style="font-weight:700;" data-profile-name></div>
        <div class="muted" data-profile-username></div>
        <div class="muted">Rol: <span data-profile-role></span></div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
      <button type="button" class="secondary" onclick="document.getElementById('profileModal').style.display='none'">Cerrar</button>
    </div>
  </div>
</div>
<script src="js/sidebar.js"></script>
</body>
</html>
