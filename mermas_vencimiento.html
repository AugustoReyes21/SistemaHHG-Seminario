<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial de mermas por vencimiento</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root{
      --bg:#eef4fb;
      --panel:#ffffff;
      --ink:#10233b;
      --muted:#5a6a7f;
      --line:#d7e1ee;
      --accent:#0f5e9c;
      --accent-2:#18a4a6;
      --bad:#b02a37;
      --shadow:0 20px 50px rgba(16,35,59,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Segoe UI',sans-serif;
      color:var(--ink);
      background:
        radial-gradient(960px 520px at 10% 12%, rgba(24,164,166,.18), transparent 58%),
        radial-gradient(860px 520px at 92% 6%, rgba(15,94,156,.18), transparent 60%),
        linear-gradient(180deg,#f5f9ff 0%, #edf3fb 50%, #e7eef9 100%);
      min-height:100vh;
    }
    .shell{max-width:1380px;margin:0 auto;padding:24px;}
    .hero{
      border-radius:24px;
      padding:28px;
      color:#fff;
      background:linear-gradient(135deg, rgba(16,35,59,.96), rgba(15,94,156,.92) 55%, rgba(172, 172, 172, 0.88));
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }
    .hero h1{margin:0;font-size:36px;line-height:1.05}
    .hero p{margin:10px 0 0;max-width:760px;color:rgba(255,255,255,.86)}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .panel{
      background:var(--panel);
      border:1px solid rgba(215,225,238,.95);
      border-radius:20px;
      padding:18px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
    }
    .filters{
      display:grid;
      grid-template-columns:repeat(5, minmax(0, 1fr));
      gap:12px;
      align-items:end;
    }
    .field label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:var(--muted);
      margin:0 0 6px;
    }
    .field input,.field select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:11px 12px;
      font:inherit;
      color:var(--ink);
      background:#f9fbfe;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font:inherit;
      font-weight:700;
      cursor:pointer;
    }
    .btn.primary{color:#fff;background:linear-gradient(135deg,var(--accent),#126db5)}
    .btn.secondary{color:var(--accent);background:#eef6ff;border:1px solid #bfd7ef}
    .status{margin:0;color:var(--muted);font-size:14px}
    .cards{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:12px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      background:linear-gradient(180deg,#fff,#f8fbff);
      min-height:120px;
    }
    .card .label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      margin:0 0 12px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .card .value{
      margin:0;
      font-size:30px;
      line-height:1.05;
      font-weight:800;
      color:var(--ink);
    }
    .card.bad .value{color:var(--bad)}
    .card .hint{margin:10px 0 0;font-size:13px;color:var(--muted)}
    .table-wrap{
      overflow:auto;
      border-radius:16px;
      border:1px solid var(--line);
      background:#fff;
    }
    table{width:100%;border-collapse:collapse;min-width:1180px}
    th,td{
      padding:12px 14px;
      border-bottom:1px solid #e8eef6;
      text-align:left;
      font-size:14px;
      white-space:nowrap;
      vertical-align:top;
    }
    th{
      position:sticky;
      top:0;
      z-index:1;
      background:#f4f8fd;
      color:#39506a;
      font-size:12px;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    td.wrap{white-space:normal;min-width:260px}
    tbody tr:hover{background:#f9fbff}
    .empty{padding:28px 14px;text-align:center;color:var(--muted)}
    @media (max-width: 1100px){
      .filters,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width: 720px){
      .shell{padding:16px}
      .hero{padding:22px}
      .hero h1{font-size:28px}
      .filters,.cards{grid-template-columns:1fr}
      .actions{justify-content:stretch}
      .actions .btn,.hero-actions .btn{flex:1}
    }
  </style>
</head>
<body class="app app-bg-photo hide-legacy-actions">
  <main class="shell">
    <section class="hero">
      <h1>Historial de mermas por vencimiento</h1>
      <div class="hero-actions">
        <button class="btn secondary" type="button" onclick="location.href='productos_vencer.html'">Ver productos por vencer</button>
      </div>
    </section>

    <section class="panel">
      <div class="filters">
        <div class="field">
          <label for="fromDate">Desde</label>
          <input id="fromDate" type="date">
        </div>
        <div class="field">
          <label for="toDate">Hasta</label>
          <input id="toDate" type="date">
        </div>
        <div class="field">
          <label for="branchFilter">Sucursal</label>
          <select id="branchFilter">
            <option value="">Todas las sucursales</option>
          </select>
        </div>
        <div class="field">
          <label for="searchInput">Buscar</label>
          <input id="searchInput" type="text" placeholder="Producto, lote o nota">
        </div>
        <div>
          <p class="status" id="rangeStatus">Cargando historial...</p>
          <div class="actions" style="margin-top:10px;">
            <button class="btn secondary" id="btnExport" type="button">Exportar XLSX</button>
            <button class="btn primary" id="btnLoad" type="button">Actualizar</button>
          </div>
        </div>
      </div>
    </section>

    <section class="cards" id="cards"></section>

    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Producto</th>
              <th>Sucursal</th>
              <th>Lote</th>
              <th>Vence</th>
              <th>Cantidad</th>
              <th>Costo Unitario</th>
              <th>Costo Total</th>
              <th>Usuario</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td class="empty" colspan="10">Cargando historial...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const moneyFmt = new Intl.NumberFormat('es-GT', {
      style: 'currency',
      currency: 'GTQ',
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
    const qtyFmt = new Intl.NumberFormat('es-GT', {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });

    function fmtMoney(value){ return moneyFmt.format(Number(value || 0)); }
    function fmtQty(value){ return qtyFmt.format(Number(value || 0)); }
    function fmtDateTime(value){
      if(!value) return '--';
      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleString('es-GT', {
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit'
      });
    }
    function fmtDate(value){
      if(!value) return '--';
      const d = new Date(`${String(value).slice(0,10)}T00:00:00`);
      if(Number.isNaN(d.getTime())) return String(value).slice(0,10);
      return d.toLocaleDateString('es-GT', { year:'numeric', month:'2-digit', day:'2-digit' });
    }

    function setDefaultRange(){
      const now = new Date();
      const end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const start = new Date(end);
      start.setDate(start.getDate() - 29);
      document.getElementById('fromDate').value = start.toISOString().slice(0,10);
      document.getElementById('toDate').value = end.toISOString().slice(0,10);
    }

    async function fetchJSON(url, opts = {}){
      const resp = await fetch(url, { credentials:'include', cache:'no-store', ...opts });
      const text = await resp.text();
      let data = null;
      try { data = JSON.parse(text); } catch (_) {}
      return { ok: resp.ok, status: resp.status, data, text };
    }

    async function ensureAuth(){
      const res = await fetchJSON('api/auth_check');
      const role = String(res.data?.user?.rol || res.data?.user?.role || '').toLowerCase();
      if(!res.ok || !res.data?.ok){
        location.href = 'login.html';
        return false;
      }
      const allowed = ['admin', 'administrador', 'contabilidad', 'farmacia', 'superadmin'];
      if(!allowed.includes(role)){
        alert('Acceso restringido');
        location.href = 'inventario.html';
        return false;
      }
      return true;
    }

    async function loadBranches(){
      const sel = document.getElementById('branchFilter');
      const res = await fetchJSON('api/branches');
      if(!res.ok || !Array.isArray(res.data)) return;
      res.data.forEach((branch) => {
        const opt = document.createElement('option');
        opt.value = branch.id;
        opt.textContent = branch.name;
        sel.appendChild(opt);
      });
    }

    function buildParams(withFormat){
      const params = new URLSearchParams();
      const from = document.getElementById('fromDate').value;
      const to = document.getElementById('toDate').value;
      const branchId = document.getElementById('branchFilter').value;
      const q = document.getElementById('searchInput').value.trim();
      if(from) params.set('from', from);
      if(to) params.set('to', to);
      if(branchId) params.set('branch_id', branchId);
      if(q) params.set('q', q);
      if(withFormat) params.set('format', withFormat);
      return params.toString();
    }

    function setBusy(isBusy){
      document.getElementById('btnLoad').disabled = isBusy;
      document.getElementById('btnExport').disabled = isBusy;
    }

    function renderCards(data){
      const summary = data?.summary || {};
      const cards = [
        { label:'Registros', value:String(summary.total_rows || 0), hint:'Mermas encontradas en el rango' },
        { label:'Productos', value:String(summary.unique_products || 0), hint:'Productos distintos castigados' },
        { label:'Cantidad castigada', value:fmtQty(summary.total_quantity), hint:'Suma total de unidades/lotes' },
        { label:'Costo total', value:fmtMoney(summary.total_cost), hint:'Impacto acumulado de la merma', tone:'bad' }
      ];
      document.getElementById('cards').innerHTML = cards.map((card) => `
        <article class="card ${card.tone || ''}">
          <p class="label">${card.label}</p>
          <p class="value">${card.value}</p>
          <p class="hint">${card.hint}</p>
        </article>
      `).join('');
    }

    function renderRows(rows){
      const body = document.getElementById('historyBody');
      if(!Array.isArray(rows) || !rows.length){
        body.innerHTML = '<tr><td class="empty" colspan="10">No hay mermas registradas para ese rango.</td></tr>';
        return;
      }
      body.innerHTML = rows.map((row) => `
        <tr>
          <td>${fmtDateTime(row.created_at)}</td>
          <td>${row.product_label || '--'}</td>
          <td>${row.branch_name || '--'}</td>
          <td>${row.lot_number || '--'}</td>
          <td>${fmtDate(row.expiry_date)}</td>
          <td class="num">${fmtQty(row.quantity)}</td>
          <td class="num">${fmtMoney(row.unit_cost)}</td>
          <td class="num">${fmtMoney(row.total_cost)}</td>
          <td>${row.created_by_name || '--'}</td>
          <td class="wrap">${row.notes || '--'}</td>
        </tr>
      `).join('');
    }

    function updateStatus(data){
      const from = data?.from;
      const to = data?.to;
      const rows = Array.isArray(data?.rows) ? data.rows.length : 0;
      const range = from && to
        ? `Rango: ${fmtDate(from)} al ${fmtDate(to)}`
        : from
        ? `Rango: desde ${fmtDate(from)}`
        : to
        ? `Rango: hasta ${fmtDate(to)}`
        : 'Sin rango';
      document.getElementById('rangeStatus').textContent = `${range}. ${rows} registro(s) visibles.`;
    }

    async function loadHistory(){
      setBusy(true);
      document.getElementById('rangeStatus').textContent = 'Consultando historial...';
      try{
        const res = await fetchJSON(`api/expired_writeoffs?${buildParams('')}`);
        if(!res.ok || !res.data?.ok){
          throw new Error(res.data?.error || 'No se pudo cargar el historial');
        }
        renderCards(res.data);
        renderRows(res.data.rows || []);
        updateStatus(res.data);
      }catch(err){
        document.getElementById('cards').innerHTML = `
          <article class="card bad">
            <p class="label">Error</p>
            <p class="value" style="font-size:22px;">Sin datos</p>
            <p class="hint">${err.message || 'No se pudo cargar el historial.'}</p>
          </article>
        `;
        document.getElementById('historyBody').innerHTML = `<tr><td class="empty" colspan="10">${err.message || 'Error cargando historial.'}</td></tr>`;
        document.getElementById('rangeStatus').textContent = 'No se pudo cargar el historial.';
      }finally{
        setBusy(false);
      }
    }

    function exportHistory(){
      window.open(`api/expired_writeoffs?${buildParams('xlsx')}`, '_blank');
    }

    function bind(){
      document.getElementById('btnLoad').addEventListener('click', loadHistory);
      document.getElementById('btnExport').addEventListener('click', exportHistory);
      document.getElementById('fromDate').addEventListener('change', loadHistory);
      document.getElementById('toDate').addEventListener('change', loadHistory);
      document.getElementById('branchFilter').addEventListener('change', loadHistory);
      document.getElementById('searchInput').addEventListener('keydown', async (e) => {
        if(e.key === 'Enter'){
          e.preventDefault();
          await loadHistory();
        }
      });
    }

    (async function init(){
      const ok = await ensureAuth();
      if(!ok) return;
      setDefaultRange();
      await loadBranches();
      bind();
      await loadHistory();
    })();
  </script>
  <script src="js/sidebar.js"></script>
</body>
</html>
