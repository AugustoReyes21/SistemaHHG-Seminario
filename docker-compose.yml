# Bases PostgreSQL para desarrollo/demostración y para la suite de pruebas.
#   docker compose up -d db        -> base de la aplicación (puerto 5432)
#   docker compose up -d db-test   -> base desechable de pruebas (puerto 5433, en memoria)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pos_retail
    ports:
      - "5432:5432"
    volumes:
      - hhg-db-data:/var/lib/postgresql/data
      - ./pos_retail.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos_retail"]
      interval: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hhg_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hhg_test"]
      interval: 2s
      retries: 30

volumes:
  hhg-db-data:
