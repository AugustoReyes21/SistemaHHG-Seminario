name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hhg_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hhg_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      HUSKY: '0'
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '5433'
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: hhg_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas unitarias e integración (PostgreSQL real)
        run: |
          mkdir -p test-results
          npm run test:report

      - name: Publicar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: test-results/junit.xml
